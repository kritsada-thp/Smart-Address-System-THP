<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Address & Label Management System</title>
    
    <!-- Theme & Mobile App Setup (Pastel Purple & Thailand Post Tone) -->
    <meta name="theme-color" content="#6B21A8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Smart Address">
    
    <!-- App Icon (Thailand Post / Package Label Theme) -->
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/ThailandPost_Logo_%282021%29.svg/512px-ThailandPost_Logo_%282021%29.svg.png">
    <link rel="manifest" id="dynamic-manifest">

    <style>
        /* Smooth scrolling & full viewport setup */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #FAF5FF; /* Pastel Background */
            -webkit-overflow-scrolling: touch; 
            font-family: 'Kanit', 'Sarabun', sans-serif;
        }
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
            display: block;
        }
        /* Loader ระหว่างรอ Apps Script โหลด */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6B21A8;
            font-weight: 600;
            font-size: 0.95rem;
            z-index: -1;
            display: flex;
            flex-col;
            align-items: center;
            gap: 12px;
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #E9D5FF;
            border-top: 4px solid #EA580C; /* THP Orange */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <div id="loader">
        <div class="spinner"></div>
        <div>กำลังเชื่อมต่อระบบ Smart Address...</div>
    </div>

    <!-- ลิงก์ Apps Script ของโปรเจกต์ -->
    <iframe 
        id="mainApp"
        src="https://script.google.com/macros/s/AKfycbz3QF773VAgP_T_6fOhsloW2gNAj0-l762Mb-3kJNLZidjyNECZcTFXlyHsZE2aOXuw5Q/exec"
        allow="geolocation; microphone; camera; clipboard-read; clipboard-write;"
    ></iframe>

    <script>
        // 📱 Dynamic PWA Manifest Setup
        document.addEventListener("DOMContentLoaded", function() {
            const appManifest = {
                "name": "Smart Address & Label Management System",
                "short_name": "Smart Address",
                "start_url": window.location.href, 
                "display": "standalone",
                "background_color": "#FAF5FF",
                "theme_color": "#6B21A8",
                "icons": [{
                    "src": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/fc/ThailandPost_Logo_%282021%29.svg/512px-ThailandPost_Logo_%282021%29.svg.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(appManifest)], {type: 'application/json'});
            document.getElementById('dynamic-manifest').href = URL.createObjectURL(manifestBlob);
        });

        // 🔄 Logic: iframe loading & Auto Focus
        const iframe = document.getElementById('mainApp');
        iframe.onload = function() {
            console.log("Smart Address System Loaded Successfully");
            iframe.contentWindow.focus();
        };

        // Fallback รีโหลดหากหน้าค้าง
        setTimeout(() => {
            if (!iframe.src) {
                iframe.src = iframe.src;
            }
        }, 3000);
    </script>
</body>
</html>
